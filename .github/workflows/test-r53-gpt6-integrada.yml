name: MRS r53 GPT6 - Regresion version de prueba

on:
  push:
    branches:
      - test/r53-gpt6-integrada-20261115
      - test/r53-gpt6-integrada-test2-20261115
  workflow_dispatch:

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: proyecto/MRS_Speech_Analytics_v3.6.19_Revision
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
      - name: Instalar dependencias de pruebas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Ejecutar pruebas de version integrada y reglas de r53
        run: |
          python -m pytest -q tests/test_review_r53_exceptions_and_excel.py tests/test_review_r53_status_optimization.py tests/test_integrated_operational_policy_r53.py tests/test_short_batch_outputs_r53.py
      - name: Verificar sintaxis de fuentes
        run: |
          python -m compileall -q app tools
