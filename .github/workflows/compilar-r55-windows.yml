name: Compilar R55 con Login e Instalador
on:
  push:
    branches: [build/r55-login-installer]
  workflow_dispatch:
jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'
      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r proyecto/MRS_Speech_Analytics_v3.6.19_Revision/requirements.txt
          python -m pip install "pyinstaller>=6.11,<7"
      - name: Compilar aplicacion para Windows
        shell: pwsh
        working-directory: proyecto/MRS_Speech_Analytics_v3.6.19_Revision
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name MRS_Speech_Analytics_R55_Login --collect-all customtkinter --collect-all faster_whisper --collect-all ctranslate2 --collect-all tokenizers --collect-all imageio_ffmpeg --collect-all av --collect-all docx --hidden-import tkinter --hidden-import PIL._tkinter_finder --contents-directory . main.py
      - name: Confirmar ejecutable
        shell: pwsh
        run: |
          $exe = "proyecto/MRS_Speech_Analytics_v3.6.19_Revision/dist/MRS_Speech_Analytics_R55_Login/MRS_Speech_Analytics_R55_Login.exe"
          if (!(Test-Path $exe)) { throw "No se genero el exe" }
          Get-Item $exe | Select-Object FullName,Length
      - name: Instrucciones para el usuario
        shell: pwsh
        run: |
          @'
          MRS Speech Analytics 3.6.19-r55
          Extraer TODO el ZIP antes de ejecutar.
          Abrir MRS_Speech_Analytics_R55_Login.exe.
          Este paquete no incluye los pesos del modelo de transcripcion: utiliza el modelo instalado localmente.
          Esta compilacion comprueba que se genero el EXE; requiere prueba en un equipo Windows real.
          '@ | Set-Content -Encoding utf8 "proyecto/MRS_Speech_Analytics_v3.6.19_Revision/dist/MRS_Speech_Analytics_R55_Login/LEEME.txt"
      - name: Crear instalador de Windows (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "No se pudo instalar Inno Setup" }
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path ${env:ProgramFiles} 'Inno Setup 6\ISCC.exe'),
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          )
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw "No se encontro ISCC.exe; rutas revisadas: $($candidates -join ', ')" }
          Write-Host "Compilador Inno Setup: $compiler"
          $output = Join-Path (Get-Location).Path 'windows-installer'
          New-Item -ItemType Directory -Force $output | Out-Null
          @'
          [Setup]
          AppId={{BD82D8B2-91BA-4B6B-AC35-FD8BC8E51A74}
          AppName=MRS Speech Analytics R55 Login
          AppVersion=3.6.19.55
          DefaultDirName={localappdata}\Programs\MRS Speech Analytics R55 Login
          DefaultGroupName=MRS Speech Analytics
          PrivilegesRequired=lowest
          OutputDir=windows-installer
          OutputBaseFilename=MRS_Speech_Analytics_R55_Login_Instalador
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          [Files]
          Source: "proyecto\MRS_Speech_Analytics_v3.6.19_Revision\dist\MRS_Speech_Analytics_R55_Login\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\MRS Speech Analytics R55"; Filename: "{app}\MRS_Speech_Analytics_R55_Login.exe"
          Name: "{autodesktop}\MRS Speech Analytics R55"; Filename: "{app}\MRS_Speech_Analytics_R55_Login.exe"; Tasks: desktopicon
          [Tasks]
          Name: desktopicon; Description: "Crear acceso directo en escritorio"; Flags: unchecked
          [Run]
          Filename: "{app}\MRS_Speech_Analytics_R55_Login.exe"; Description: "Iniciar MRS Speech Analytics"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path 'mrs_installer.iss' -Encoding utf8
          & $compiler "mrs_installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Fallo al crear el instalador (ISCC exit $LASTEXITCODE)" }
          $installer = Join-Path $output 'MRS_Speech_Analytics_R55_Login_Instalador.exe'
          if (-not (Test-Path $installer)) { throw "No se genero el instalador en $installer" }
          Get-Item $installer | Select-Object FullName,Length
      - uses: actions/upload-artifact@v4
        with:
          name: MRS_R55_Login_Instalador_Windows
          path: windows-installer/*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: MRS_Speech_Analytics_R55_Login_Portable
          path: proyecto/MRS_Speech_Analytics_v3.6.19_Revision/dist/MRS_Speech_Analytics_R55_Login/
          if-no-files-found: error
          retention-days: 14
