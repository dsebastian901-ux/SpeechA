name: Compilar EXE MRS Speech Analytics R55
on:
  push:
    branches: [build/r55-windows-exe]
  workflow_dispatch:
jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'
      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r proyecto/MRS_Speech_Analytics_v3.6.19_Revision/requirements.txt
          python -m pip install "pyinstaller>=6.11,<7"
      - name: Compilar aplicacion para Windows
        shell: pwsh
        working-directory: proyecto/MRS_Speech_Analytics_v3.6.19_Revision
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name MRS_Speech_Analytics_R55 --collect-all customtkinter --collect-all faster_whisper --collect-all ctranslate2 --collect-all tokenizers --collect-all imageio_ffmpeg --collect-all av --collect-all docx --hidden-import tkinter --hidden-import PIL._tkinter_finder --contents-directory . main.py
      - name: Confirmar ejecutable
        shell: pwsh
        run: |
          $exe = "proyecto/MRS_Speech_Analytics_v3.6.19_Revision/dist/MRS_Speech_Analytics_R55/MRS_Speech_Analytics_R55.exe"
          if (!(Test-Path $exe)) { throw "No se genero el exe" }
          Get-Item $exe | Select-Object FullName,Length
      - name: Instrucciones para el usuario
        shell: pwsh
        run: |
          @'
          MRS Speech Analytics 3.6.19-r55
          Extraer TODO el ZIP antes de ejecutar.
          Abrir MRS_Speech_Analytics_R55.exe.
          Este paquete no incluye los pesos del modelo de transcripcion: utiliza el modelo instalado localmente.
          Esta compilacion comprueba que se genero el EXE; requiere prueba en un equipo Windows real.
          '@ | Set-Content -Encoding utf8 "proyecto/MRS_Speech_Analytics_v3.6.19_Revision/dist/MRS_Speech_Analytics_R55/LEEME.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: MRS_Speech_Analytics_R55_Windows_EXE
          path: proyecto/MRS_Speech_Analytics_v3.6.19_Revision/dist/MRS_Speech_Analytics_R55/
          if-no-files-found: error
          retention-days: 14
